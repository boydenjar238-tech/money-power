<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Power - Earn Real Money Online</title>
    <meta name="description" content="Money Power app par daily tasks complete karein aur real cash kamaein!">
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #eef2f5; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 8px; }
        .btn-withdraw { background: #007bff; margin-top: 8px; }
        .btn-task2 { background: #ff9900; }
        .hidden { display: none; }
        .balance { font-size: 26px; color: #28a745; font-weight: bold; }
        .ad-box { background: #fff3cd; border: 1px dashed #ffeb8a; padding: 10px; margin: 15px 0; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>⚡ Money Power ⚡</h2>

    <!-- LOGIN & REGISTER -->
    <div id="authBox" class="card">
        <h3 id="formTitle">User Login</h3>
        <input type="text" id="username" placeholder="Phone Number / Username">
        <input type="password" id="password" placeholder="Password">
        <input type="text" id="upiId" placeholder="UPI ID" class="hidden">
        
        <button id="authBtn" onclick="handleAuth()">Login Karein</button>
        <p style="cursor:pointer; color:#007bff; font-size:14px;" onclick="toggleAuthMode()">
            <span id="toggleText">Naya Account Banayein (Register)</span>
        </p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden">
        <div class="card">
            <h3>Welcome, <span id="userDisp"></span>!</h3>
            <p>Wallet Balance:</p>
            <div class="balance">₹<span id="balance">0</span></div>
        </div>

        <!-- Ad Space -->
        <div class="ad-box">
            <p>[ ADVERTISEMENT PLACEHOLDER ]</p>
        </div>

        <div class="card" style="margin-top: 15px;">
            <h3>Task Complete Karein</h3>
            <p>Ad dekhein aur Instant Wallet balance paayein!</p>
            
            <!-- Task Buttons with New HilltopAds Direct Link -->
            <button onclick="openAdTask('https://thoroughgear.com/9O07aE')">Task 1: Watch Ad & Earn ₹5</button>
            <button class="btn-task2" onclick="openAdTask('https://thoroughgear.com/9O07aE')">Task 2: Special Ad Bonus ₹5</button>

            <button class="btn-withdraw" onclick="withdrawCashfree()">Instant Cashfree Withdraw</button>
        </div>
    </div>

    <script>
        function openAdTask(adUrl) {
            window.open(adUrl, '_blank');
            if (typeof completeTask === "function") {
                completeTask();
            }
        }
    </script>

</body>
</html>
