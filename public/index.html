<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Power - Earn Real Money Online</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #eef2f5; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        button, .btn-link { display: block; background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 8px; text-decoration: none; box-sizing: border-box; }
        .btn-withdraw { background: #007bff; margin-top: 8px; }
        .hidden { display: none; }
        .balance { font-size: 26px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <h2>⚡ Money Power ⚡</h2>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <div class="card">
            <h3>Welcome User!</h3>
            <p>Wallet Balance:</p>
            <div class="balance">₹<span id="balance">20</span></div>
        </div>

        <div class="card" style="margin-top: 15px;">
            <h3>Daily Tasks & Ads</h3>
            <p>Task complete karke ₹10 kamaein</p>
            
            <!-- Direct Anchor Link prevents popup blocker -->
            <a href="https://thoroughgear.com/9O07aE" target="_blank" class="btn-link" onclick="rewardUser()">Complete Task & Claim ₹10</a>

            <button class="btn-withdraw">Instant Redeem</button>
        </div>
    </div>

    <script>
        function rewardUser() {
            let current = parseInt(document.getElementById('balance').innerText) || 0;
            document.getElementById('balance').innerText = current + 10;
        }
    </script>

</body>
</html>
